name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Safe agent passes, naive agent is caught
        run: |
          agentguard test --agent careful --scenario duplicate-after-timeout
          ! agentguard test --agent naive --scenario duplicate-after-timeout
